# Publishes tabletop/ as the repository's GitHub Pages site.
#
# This file is inert where it sits. To use it, copy it to
# .github/workflows/tabletop-pages.yml in the repository root and set
# Settings -> Pages -> Source to "GitHub Actions".
#
# It makes this app the whole Pages site. If you would rather serve the parent
# project at the root and this at /tabletop/, do not use this workflow at all:
# a plain branch deploy already publishes both.

name: Deploy Tabletop to Pages

on:
  push:
    branches: [main]
    paths: ['tabletop/**', '.github/workflows/tabletop-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run supersedes an older one rather than
# cancelling a deploy that is already halfway out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tabletop
      - id: deployment
        uses: actions/deploy-pages@v4
