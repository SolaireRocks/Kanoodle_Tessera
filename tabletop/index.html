<!doctype html>
<html lang="en" data-palette="ARENA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090B">
<meta name="description" content="Tessera Tabletop — rolls a solvable opening for a physical polysphere set, draws it as a lettered sheet you can copy bead for bead, and keeps the times you bring back. Exports to JSON and CSV.">
<title>Tessera Tabletop — openings and times for a physical set</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2308090B'/%3E%3Ccircle cx='11' cy='11' r='4.5' fill='%2300E5A0'/%3E%3Ccircle cx='21' cy='11' r='4.5' fill='%23FF4D6D'/%3E%3Ccircle cx='11' cy='21' r='4.5' fill='%2335A7FF'/%3E%3Ccircle cx='21' cy='21' r='4.5' fill='%23FFD23F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./src/styles/tokens.css">
<link rel="stylesheet" href="./src/styles/app.css">
</head>
<body>
<div id="app" role="application" aria-label="Tessera Tabletop"></div>
<div id="overlay"></div>
<div id="live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<noscript style="display:block;padding:40px;font-family:sans-serif;color:#F2F4F7;line-height:1.6">
  Tessera Tabletop needs JavaScript — the opening generator is an exact-cover
  solver that runs entirely in your browser.
</noscript>
<script type="module" src="./src/ui/app.js"></script>
<script>
  // Offline is the point here: the set is on a table, and the table is not
  // always near the Wi-Fi. Registration is best-effort — the page works
  // identically without it, and a file:// open has no service worker at all.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
